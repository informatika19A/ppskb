<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPI Informatika 2026 — Perencanaan Sistem Komputer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6ff;--ink:#1f2547;--mut:#6a7196;--p:#5b6cff;--p2:#8a5bff;--pink:#ff6bb5;--mint:#1fcfa8;--yel:#ffc43d;--ora:#ff8a5b;--sky:#34b8ff;--card:#fff;--line:#e6e9fb;--r:22px;--sh:0 10px 30px rgba(91,108,255,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;line-height:1.6}
h1,h2,h3,h4{font-family:'Sora','Plus Jakarta Sans',sans-serif;line-height:1.25}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 500px at 10% -10%,#e3e7ff 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#ffe3f2 0,transparent 55%),radial-gradient(900px 600px at 50% 110%,#d9fbf2 0,transparent 55%),var(--bg)}
.blob{position:absolute;border-radius:50%;opacity:.55;filter:blur(2px)}
.b1{width:180px;height:180px;background:#cfd6ff;left:-40px;top:22%}
.b2{width:120px;height:120px;background:#ffd0e8;right:6%;top:14%}
.b3{width:150px;height:150px;background:#c4f5e8;right:-30px;bottom:18%}
.b4{width:80px;height:80px;background:#ffe9a8;left:8%;bottom:8%}
.sq{position:absolute;width:46px;height:46px;border-radius:14px;background:#ffd9c7;opacity:.6;left:42%;top:8%;transform:rotate(18deg)}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:800;font-size:18px}
.logo i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;box-shadow:var(--sh)}
.logo small{display:block;font-family:'Plus Jakarta Sans';font-weight:600;font-size:11px;color:var(--mut);margin-top:-4px}
.who{font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:none;box-shadow:var(--sh)}
.stepper{max-width:1100px;margin:auto;padding:0 18px 10px;display:none;gap:8px;overflow-x:auto}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--mut);transition:.2s}
.step .n{width:24px;height:24px;border-radius:8px;background:#eef0ff;display:grid;place-items:center;font-size:12px}
.step.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:var(--sh)}
.step.on .n{background:rgba(255,255,255,.25);color:#fff}
.step.done .n{background:var(--mint);color:#fff}
.step.lock{opacity:.5}
main{max-width:1100px;margin:auto;padding:22px 18px 70px}
.view{display:none;animation:in .35s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:24px;border:1px solid var(--line);margin-bottom:18px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;background:#eef0ff;color:var(--p);letter-spacing:.3px}
.tag.pink{background:#ffe4f2;color:#d63384}.tag.mint{background:#d9fbf2;color:#0c8a6e}.tag.yel{background:#fff1c9;color:#a07100}.tag.ora{background:#ffe5d9;color:#c2410c}
h1{font-size:clamp(26px,4.4vw,42px);margin:12px 0}
h2{font-size:clamp(20px,3vw,27px);margin-bottom:6px}
h3{font-size:18px;margin-bottom:6px}
.grad{background:linear-gradient(90deg,var(--p),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{color:var(--mut);font-size:15px}
.field{margin-bottom:14px}
label.l{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input[type=text],input[type=date],input[type=password],select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font:inherit;background:#fbfcff;color:var(--ink);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(91,108,255,.12);background:#fff}
textarea{min-height:130px;resize:vertical}
.btn{font:inherit;font-weight:800;border:0;cursor:pointer;padding:12px 22px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 8px 20px rgba(91,108,255,.3);transition:.2s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.alt{background:#fff;color:var(--p);border:2px solid var(--line);box-shadow:none}
.btn.mint{background:linear-gradient(135deg,var(--mint),#12b3d6);box-shadow:0 8px 20px rgba(31,207,168,.3)}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--ora));box-shadow:0 8px 20px rgba(255,107,181,.3)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.simc{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.grid4{grid-template-columns:1fr 1fr}.simc{grid-template-columns:1fr}}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.illu{background:linear-gradient(135deg,#eef0ff,#ffe9f5);border-radius:26px;padding:22px;position:relative;min-height:260px;display:grid;place-items:center}
.q{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:#fff}
.q .qn{display:flex;gap:10px;font-weight:700;margin-bottom:10px}
.q .qn b{flex:0 0 32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;display:grid;place-items:center;font-size:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer;transition:.15s;font-size:14px}
.opt:hover{border-color:#b9c0ff;background:#fafbff}
.opt input{margin-top:4px;accent-color:var(--p)}
.opt .lt{flex:0 0 26px;height:26px;border-radius:8px;background:#eef0ff;color:var(--p);font-weight:800;font-size:12px;display:grid;place-items:center}
.opt:has(input:checked){border-color:var(--p);background:#f1f3ff}
.opt.ok{border-color:var(--mint);background:#e9fdf7}
.opt.bad{border-color:#ff6b6b;background:#fff0f0}
.sect{display:flex;gap:10px;align-items:center;margin:18px 0 10px}
.sect span{font-size:22px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.seen::after{content:" ✓";color:var(--mint)}
.pbar{height:10px;border-radius:99px;background:#e9ecff;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--pink));transition:width .5s}
.box{border-radius:18px;padding:14px 16px;font-size:14px}
.box.b1x{background:#eef0ff}.box.b2x{background:#e9fdf7}.box.b3x{background:#fff1f2}.box.b4x{background:#fff8e1}
.box h4{font-size:14px;margin-bottom:6px}
.box ul{padding-left:18px}.box li{margin:3px 0}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.flow .fc{padding:7px 12px;border-radius:12px;font-weight:700;font-size:12.5px;color:#fff}
.flow .ar{color:var(--mut);font-weight:800}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;overflow:hidden;border-radius:16px;border:1px solid var(--line)}
.t th{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px;text-align:left}
.t td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.t tr:nth-child(even) td{background:#fafbff}
.scroll{overflow-x:auto}
.meter{margin:8px 0}.meter .ml{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:3px}
.meter .mb{height:12px;background:#eef0ff;border-radius:99px;overflow:hidden}
.meter .mb i{display:block;height:100%;border-radius:99px;transition:width .6s}
.choice{width:100%;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:10px;transition:.15s;font-size:14px}
.choice:hover:not(:disabled){border-color:var(--p);transform:translateX(4px)}
.choice.ok{border-color:var(--mint);background:#e9fdf7}.choice.bad{border-color:#ff7b7b;background:#fff0f0}.choice.pick{border-color:var(--p);background:#f1f3ff}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:14px}
.fb.ok{background:#e9fdf7;border-left:5px solid var(--mint)}.fb.bad{background:#fff0f0;border-left:5px solid #ff7b7b}.fb.info{background:#eef0ff;border-left:5px solid var(--p)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.likert{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.likert .sc{display:flex;gap:6px}
.likert .sc label{cursor:pointer}
.likert .sc input{display:none}
.likert .sc span{width:36px;height:36px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;transition:.15s}
.likert .sc input:checked+span{background:var(--p);color:#fff;border-color:var(--p);transform:scale(1.1)}
@media(max-width:640px){.likert{grid-template-columns:1fr}}
.nocopy,.nocopy *:not(textarea){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nocopy textarea{-webkit-user-select:text;user-select:text}
.wc{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.sync{position:fixed;right:14px;bottom:14px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--sh);z-index:30;display:none}
.modal{position:fixed;inset:0;background:rgba(31,37,71,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modal .mc{background:#fff;border-radius:24px;padding:24px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal .mc.wide{max-width:820px;max-height:90vh;overflow:auto}
.stat{padding:16px;border-radius:18px;color:#fff}
.stat b{display:block;font-family:Sora;font-size:28px}
.stat small{font-weight:600;opacity:.9}
.s1{background:linear-gradient(135deg,#5b6cff,#8a5bff)}.s2{background:linear-gradient(135deg,#1fcfa8,#12b3d6)}.s3{background:linear-gradient(135deg,#ff6bb5,#ff8a5b)}.s4{background:linear-gradient(135deg,#ffc43d,#ff8a5b)}
.bars{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;font-size:13px;font-weight:700}
.bar-row .bb{display:grid;gap:4px}.bar-row .bb div{height:14px;border-radius:99px;font-size:10px;color:#fff;padding-left:8px;line-height:14px;min-width:24px}
.ring{width:100%;max-width:380px;margin:auto;display:block}
.ring g{cursor:pointer}
.big{font-family:Sora;font-weight:800;font-size:34px}
.score{border-radius:20px;padding:18px;text-align:center;color:#fff}
.chip-s{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#eef0ff;color:var(--p)}
.warn{background:#fff8e1;border:2px dashed #ffc43d;border-radius:16px;padding:12px 14px;font-size:13.5px}
.kv td{padding:4px 8px;font-size:13px}
a.lnk{color:var(--p);font-weight:700;cursor:pointer;text-decoration:underline}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.btn:hover{transform:none!important}.blob,.sq{display:none}
</style>
</head>

function go(name){
  if(name!=='login'&&name!=='guru'&&S.profile){const st=winState(S.profile.kelas);if((st.s==='end'||st.s==='wait'||st.s==='none')&&name!=='hasil'){toast('⏰ '+winMsg(S.profile.kelas,st));name='login'}}
  if(name!=='login'&&name!=='guru'&&!S.profile){name='login'}
  if(STEPS.some(s=>s.id===name)&&!unlocked(name)){toast(lockMsg[name]);return}
  $$('.view').forEach(v=>v.classList.remove('on'));$('#v-'+name).classList.add('on');
  if(STEPS.some(s=>s.id===name)){S.stage=name;save()}
  ({login:rLogin,pre:rPre,materi:rMateri,sim:rSim,post:rPost,refl:rRefl,hasil:rHasil,guru:rGuru})[name]();
  renderStepper(name);window.scrollTo({top:0,behavior:'smooth'});
  document.body.dataset.view=name;
}
function renderStepper(cur){
  const st=$('#stepper'),who=$('#who');
  if(!S.profile||cur==='login'||cur==='guru'){st.style.display='none';who.style.display=cur==='guru'?'block':'none';if(cur==='guru')who.textContent='👩‍🏫 Mode Guru';return}
  st.style.display='flex';who.style.display='block';who.textContent=`👤 ${S.profile.nama} • ${S.profile.kelas}`;
  st.innerHTML=STEPS.map(s=>`<div class="step ${s.id===cur?'on':''} ${isDone(s.id)&&s.id!==cur?'done':''} ${unlocked(s.id)?'':'lock'}" data-go="${s.id}"><span class="n">${isDone(s.id)&&s.id!==cur?'✓':s.n}</span>${s.t}</div>`).join('');
  $$('.step',st).forEach(e=>e.onclick=()=>go(e.dataset.go));
}

let syncT;
function sync(now){clearTimeout(syncT);syncT=setTimeout(doSync,now?0:500)}
async function doSync(){
  save();if(!S.profile)return;
  const b=$('#sync');b.style.display='block';
  if(S.profile.demo){b.textContent='🎬 Mode demo — tidak dikirim ke Google Sheet';return}
  if(!CFG.SCRIPT_URL){b.textContent='💾 Mode lokal (belum terhubung Google Sheet)';return}
  b.textContent='⏳ Menyimpan…';
  try{
    const r=await fetch(CFG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:record()})});
    const j=await r.json();b.textContent=j.ok?'✅ Tersimpan ke Google Sheet':'⚠️ Gagal: '+(j.error||'');
  }catch(e){b.textContent='⚠️ Offline — data disimpan di perangkat, akan dikirim ulang'}
  setTimeout(()=>{if(b.textContent.startsWith('✅'))b.style.display='none'},2500);
}
async function api(action,extra){
  const r=await fetch(CFG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...extra})});
  return r.json();
}

   JADWAL PENGERJAAN PER KELAS (diatur guru, waktu WIB)
   ============================================================ */
let JADWAL={},SRV=0,JOK=false;
async function loadJadwal(){if(!CFG.SCRIPT_URL)return;try{const j=await api('getSchedule',{});if(j.ok){JADWAL=j.jadwal||{};SRV=j.now-Date.now();JOK=true}}catch(e){JOK=false}}
function winState(kelas){
  if(!CFG.SCRIPT_URL)return {s:'open'};
  if(!JOK)return {s:'err'};
  const w=JADWAL[kelas];if(!w||!w.mulai||!w.selesai)return {s:'none'};
  const t=Date.now()+SRV,a=Date.parse(w.mulai),b=Date.parse(w.selesai);
  return t<a?{s:'wait',w}:t>b?{s:'end',w}:{s:'open',w};
}
const fmtW=iso=>new Date(Date.parse(iso)+7*36e5).toLocaleString('id-ID',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/\./g,':')+' WIB';
const toLocalIn=iso=>iso?new Date(Date.parse(iso)+7*36e5).toISOString().slice(0,16):'';
const winMsg=(k,st)=>({err:'Jadwal tidak dapat diperiksa. Periksa koneksi internet lalu coba lagi.',none:`Kelas ${k} belum dijadwalkan oleh guru.`,
  wait:st.w?`Pengerjaan kelas ${k} dimulai ${fmtW(st.w.mulai)}.`:'',end:st.w?`Waktu pengerjaan kelas ${k} telah berakhir (${fmtW(st.w.selesai)}).`:''})[st.s];
setInterval(async()=>{
  if(!S.profile||!CFG.SCRIPT_URL)return;
  const v=document.body.dataset.view;if(v==='login'||v==='guru')return;
  await loadJadwal();const st=winState(S.profile.kelas);
  if(st.s==='end'||st.s==='none'||st.s==='wait'){if(v!=='hasil'){toast('⏰ '+winMsg(S.profile.kelas,st));go(S.refl?'hasil':'login')}}
},60000);

const L='ABCDE';
function qBlock(q,i,pref,num){
  const inp=q.t==='pgk'?'checkbox':'radio';
  return `<div class="q"><div class="qn"><b>${num}</b><div>${q.q}</div></div>${q.o.map((o,j)=>`<label class="opt"><input type="${inp}" name="${pref}${i}" value="${j}"><span class="lt">${L[j]}</span><span>${esc(o)}</span></label>`).join('')}</div>`;
}
function scorePre(ans){
  let pg=0,pgk=0;
  PRE.forEach((q,i)=>{
    if(q.t==='pg'){if(ans[i][0]===q.a)pg+=10}
    else{const c=ans[i].filter(x=>q.a.includes(x)).length,w=ans[i].length-c;pgk+=Math.max(0,c-w)/q.a.length*10}
  });
  pgk=Math.round(pgk*10)/10;
  return {pg,pgk,total:Math.round((pg+pgk)*10)/10,ans};
}
function rPre(){
  const v=$('#v-pre');
  if(S.pre){
    v.innerHTML=`<div class="card" style="text-align:center"><span class="tag mint">✅ Pre-test selesai</span><h2 style="margin-top:10px">Pre-test sudah kamu kerjakan!</h2>
    <p class="lead">Ini titik awalmu. Jangan khawatir soal-soal yang belum bisa, itulah yang akan kamu pelajari.</p>
    <div class="grid3" style="margin:18px 0;max-width:640px;margin-inline:auto"><div class="score s1"><div class="big">${S.pre.pg}</div>PG (maks 50)</div><div class="score s3"><div class="big">${S.pre.pgk}</div>PG Kompleks (maks 50)</div><div class="score s2"><div class="big">${S.pre.total}</div>Total / 100</div></div>
    <button class="btn" id="toMat">Lanjut ke Materi 📖</button></div>`;
    $('#toMat').onclick=()=>go('materi');return;
  }
  v.innerHTML=`<div class="card"><span class="tag">📝 Langkah 1</span><h2 style="margin-top:8px">Pre-test: Seberapa Kamu Tahu?</h2>
   <p class="lead">Kerjakan jujur dan mandiri untuk mengetahui kemampuan awalmu. Bagian A: 5 soal pilihan ganda. Bagian B: 5 soal pilihan ganda kompleks (jawaban benar bisa lebih dari satu). Pre-test hanya bisa dikirim sekali.</p></div>
   <div class="sect"><span>🅰️</span><h3>Bagian A — Pilihan Ganda (pilih 1 jawaban)</h3></div>
   ${PRE.slice(0,5).map((q,i)=>qBlock(q,i,'p',i+1)).join('')}
   <div class="sect"><span>🅱️</span><h3>Bagian B — Pilihan Ganda Kompleks (pilih semua yang benar)</h3></div>
   ${PRE.slice(5).map((q,i)=>qBlock(q,i+5,'p',i+6)).join('')}
   <div class="row" style="justify-content:space-between"><span id="preInfo" class="lead"></span><button class="btn mint" id="preGo">Kirim Pre-test ✅</button></div>`;
  const upd=()=>{let n=0;PRE.forEach((q,i)=>{if($$(`input[name=p${i}]:checked`).length)n++});$('#preInfo').textContent=`Terjawab ${n}/10`};
  $$('#v-pre input').forEach(x=>x.onchange=upd);upd();
  $('#preGo').onclick=()=>{
    const ans=PRE.map((q,i)=>$$(`input[name=p${i}]:checked`).map(x=>+x.value));
    const miss=ans.findIndex(a=>!a.length);
    if(miss>=0){toast(`Soal nomor ${miss+1} belum dijawab`);$$('.q')[miss].scrollIntoView({behavior:'smooth',block:'center'});return}
    S.pre=scorePre(ans);save();sync(true);toast('Pre-test terkirim! 🎉');go('pre');
  };
}

/* ============================================================
   POST-TEST (LKPD) — copy-paste dinonaktifkan
   ============================================================ */
function violLog(k,msg){if(S.post.submitted)return;S.post.viol[k]++;save();if(msg)toast(msg);sync()}
function installLock(){
  const v=$('#v-post');
  const onPaste=e=>{e.preventDefault();violLog('paste','🚫 Paste dinonaktifkan. Ketik jawabanmu sendiri ya!')};
  ['paste','drop'].forEach(ev=>v.addEventListener(ev,onPaste));
  v.addEventListener('copy',e=>{e.preventDefault();violLog('copy','🚫 Copy dinonaktifkan.')});
  v.addEventListener('cut',e=>{e.preventDefault();violLog('copy','🚫 Cut dinonaktifkan.')});
  v.addEventListener('contextmenu',e=>e.preventDefault());
  v.addEventListener('dragstart',e=>e.preventDefault());
  v.addEventListener('selectstart',e=>{if(!e.target.closest||!e.target.closest('textarea'))e.preventDefault()});
  v.addEventListener('beforeinput',e=>{if(/^insertFromPaste|^insertFromDrop|^insertFromYank/.test(e.inputType||'')){e.preventDefault();violLog('paste','🚫 Menempel teks dinonaktifkan.')}});
  v.addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&['c','v','x','insert'].includes(k)){e.preventDefault();violLog(k==='v'?'paste':'copy','🚫 Pintasan copy/paste dinonaktifkan.')}
    if(e.shiftKey&&k==='insert'){e.preventDefault();violLog('paste','🚫 Paste dinonaktifkan.')}
  });
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&document.body.dataset.view==='post'&&S.profile&&!S.post.submitted&&S.post.pred!==null)violLog('tab')});
function scoreLkpd(ans){return LKPD.map((q,i)=>{const t=ans[i].toLowerCase();const hit=q.kw.map(r=>r.test(t)?1:0);return Math.round(hit.reduce((a,b)=>a+b,0)/q.kw.length*100)})}
function rPost(){
  const v=$('#v-post'),P=S.post;
  if(!v.dataset.lock){installLock();v.dataset.lock=1}
  if(P.submitted){
    v.innerHTML=`<div class="card" style="text-align:center"><span class="tag mint">✅ LKPD terkirim</span><h2 style="margin-top:10px">Jawabanmu sudah tersimpan</h2>
    <p class="lead">Guru akan menilai jawaban uraianmu. Estimasi otomatis (berdasarkan kata kunci konsep) hanyalah gambaran awal.</p>
    <div class="score s2" style="max-width:260px;margin:14px auto"><div class="big">${P.auto}</div>Estimasi otomatis / 100</div>
    <button class="btn" id="toR">Lanjut ke Refleksi 💭</button></div>`;
    $('#toR').onclick=()=>go('refl');return;
  }
  if(P.pred===null){
    v.innerHTML=`<div class="card"><span class="tag ora">✍️ Langkah 4</span><h2 style="margin-top:8px">Post-test: LKPD</h2>
    <p class="lead">LKPD berisi 4 soal uraian: 2 soal untuk Tujuan 1 (perencanaan) dan 2 soal untuk Tujuan 2 (kebutuhan sistem); tiap tujuan memuat 1 soal biasa dan 1 soal HOTS.</p>
    <div class="box b1x"><h4>🧭 Sebelum mulai — prediksi dirimu (metakognisi)</h4><p style="font-size:14px;margin-bottom:8px">Menurutmu, berapa nilai yang akan kamu peroleh pada LKPD ini? (0–100)</p>
    <div class="row"><input type="range" id="pred" min="0" max="100" value="70" style="flex:1;accent-color:#5b6cff"><b class="big" id="predV" style="font-size:28px;min-width:64px">70</b></div></div>
    <button class="btn" id="startP" style="margin-top:14px">Mulai Mengerjakan 🚀</button></div>`;
    $('#pred').oninput=e=>$('#predV').textContent=e.target.value;
    $('#startP').onclick=()=>{P.pred=+$('#pred').value;save();sync();rPost()};return;
  }
  v.classList.add('nocopy');
  v.innerHTML=`<div class="card"><span class="tag ora">✍️ LKPD</span><h2 style="margin-top:8px">Lembar Kerja Peserta Didik</h2>
   <p class="lead">Jawab dengan kalimatmu sendiri (minimal 15 kata per soal).</p></div>
   ${LKPD.map((q,i)=>`<div class="q"><div class="qn"><b>${i+1}</b><div><span class="tag ${i<2?'':'pink'}" style="margin-bottom:6px">${q.tp}</span><div>${q.q}</div></div></div>
   <textarea id="ans${i}" placeholder="Ketik jawabanmu di sini…" autocomplete="off" autocorrect="off" spellcheck="false">${esc(P.ans[i])}</textarea><div class="wc" id="wc${i}">0 kata</div></div>`).join('')}
   <div class="row" style="justify-content:space-between"><span class="lead" id="lkInfo"></span><button class="btn mint" id="lkGo">Kirim LKPD ✅</button></div>`;
  LKPD.forEach((q,i)=>{
    const t=$('#ans'+i);const u=()=>$('#wc'+i).textContent=wc(t.value)+' kata';u();
    let prev=t.value;
    t.addEventListener('input',e=>{
      if(t.value.length-prev.length>40&&!/composition/i.test(e.inputType||'')){t.value=prev;violLog('jump','🚫 Teks yang masuk terlalu banyak sekaligus, ditolak.');return}
      prev=t.value;P.ans[i]=t.value;u();save();sync()});
  });
  $('#lkGo').onclick=()=>{
    const short=P.ans.findIndex(a=>wc(a)<15);
    if(short>=0){toast(`Jawaban nomor ${short+1} minimal 15 kata`);$('#ans'+short).focus();return}
    if(!confirm('Kirim LKPD sekarang? Jawaban tidak bisa diubah setelah dikirim.'))return;
    const det=scoreLkpd(P.ans);
    P.detail=det;P.auto=Math.round(det.reduce((a,b)=>a+b,0)/det.length);P.submitted=true;save();sync(true);toast('LKPD terkirim! 🎉');go('post');
  };
}

  if(!CFG.SCRIPT_URL){GURU.pw='';GURU.rows=S.profile?[localRow()]:[];GURU.local=true;$('#mGuru').classList.remove('on');go('guru');return}
  er.textContent='Memeriksa…';
  try{const j=await api('list',{password:pw});if(!j.ok){er.textContent=j.error||'Gagal.';return}
    GURU={pw,rows:j.rows,local:false};await loadJadwal();$('#mGuru').classList.remove('on');go('guru');
  }catch(e){er.textContent='Tidak dapat terhubung ke server. Periksa SCRIPT_URL di config.js.'}
};
function localRow(){const r=record();r.nilai_guru='';r.catatan_guru='';return r}
const num=x=>(x===''||x===null||x===undefined||isNaN(+x))?null:+x;
const final=r=>num(r.nilai_guru)!==null?num(r.nilai_guru):num(r.post_auto);
const avg=a=>{a=a.filter(x=>x!==null);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0};
const jp=(s,d)=>{try{return JSON.parse(s)}catch(e){return d}};
function rGuru(){
  const v=$('#v-guru');
  v.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><span class="tag pink">👩‍🏫 Dasbor Guru</span><h2 style="margin-top:8px">Pemantauan Hasil Siswa</h2>${GURU.local?'<p class="lead" style="color:#c2410c">Mode lokal: belum terhubung ke Google Sheet. Hanya menampilkan data perangkat ini.</p>':''}</div>
   <div class="row"><button class="btn sm alt" id="gRef">🔄 Muat ulang</button><button class="btn sm mint" id="gCsv">⬇️ Ekspor CSV</button><button class="btn sm alt" id="gOut">Keluar</button></div></div></div>
   <div class="card"><h3>🗓️ Jadwal Pengerjaan per Kelas <span class="lead" style="font-size:12px">(waktu WIB)</span></h3>
   ${GURU.local?'<p class="lead" style="color:#c2410c">Jadwal hanya dapat diatur setelah terhubung ke Google Sheet.</p>':`<div class="scroll"><table class="t"><thead><tr><th>Kelas</th><th>Mulai</th><th>Berakhir</th><th>Status</th></tr></thead><tbody>${KELAS.map(k=>{const w=JADWAL[k]||{},st=winState(k).s;return `<tr><td><b>${k}</b></td><td><input type="datetime-local" data-k="${k}" data-f="mulai" value="${toLocalIn(w.mulai)}"></td><td><input type="datetime-local" data-k="${k}" data-f="selesai" value="${toLocalIn(w.selesai)}"></td><td>${({open:'🟢 Berlangsung',wait:'🟡 Belum mulai',end:'🔴 Selesai',none:'⚪ Belum diatur',err:'⚠️'})[st]}</td></tr>`}).join('')}</tbody></table></div>
   <div class="row" style="margin-top:12px"><button class="btn sm" id="gJad">💾 Simpan Jadwal</button><span class="lead" style="font-size:12.5px">Siswa hanya bisa masuk dan menyimpan jawaban dalam rentang ini.</span></div>`}</div>
   <div id="gStats"></div>
   <div class="card"><div class="row" style="margin-bottom:12px"><select id="gKelas" style="max-width:160px"><option value="">Semua kelas</option>${KELAS.map(k=>`<option>${k}</option>`).join('')}</select><input type="text" id="gCari" placeholder="Cari nama / NIS…" style="max-width:260px"></div><div class="scroll"><table class="t" id="gTable"></table></div></div>`;
  $('#gKelas').onchange=drawGuru;$('#gCari').oninput=drawGuru;
  $('#gOut').onclick=()=>{GURU={pw:'',rows:[]};go('login')};
  $('#gCsv').onclick=csv;
  const gj=$('#gJad');if(gj)gj.onclick=async()=>{
    const jd={};let bad='';
    KELAS.forEach(k=>{const a=$(`input[data-k="${k}"][data-f="mulai"]`).value,b=$(`input[data-k="${k}"][data-f="selesai"]`).value;
      if(a&&b){if(b<=a)bad=k;jd[k]={mulai:a+':00+07:00',selesai:b+':00+07:00'}}else if(a||b)bad=k});
    if(bad)return toast(`Jadwal kelas ${bad} belum lengkap atau waktu selesai sebelum mulai`);
    try{const j=await api('setSchedule',{password:GURU.pw,jadwal:jd});if(j.ok){await loadJadwal();rGuru();toast('Jadwal tersimpan ✅')}else toast(j.error||'Gagal')}catch(e){toast('Gagal terhubung')}};
  $('#gRef').onclick=async()=>{if(GURU.local){GURU.rows=S.profile?[localRow()]:[];drawGuru();return}try{const j=await api('list',{password:GURU.pw});if(j.ok){GURU.rows=j.rows;drawGuru();toast('Data dimuat ulang ✅')}else toast(j.error)}catch(e){toast('Gagal terhubung')}};
  drawGuru();
}
function filtered(){const k=$('#gKelas').value,q=$('#gCari').value.toLowerCase();return GURU.rows.filter(r=>(!k||r.kelas===k)&&(!q||String(r.nama).toLowerCase().includes(q)||String(r.nis).includes(q)))}
function drawGuru(){
  const all=GURU.rows,rows=filtered();
  const done=all.filter(r=>r.status==='Selesai'||r.status==='Dinilai').length;
  const pre=avg(all.map(r=>num(r.pre_total))),fin=avg(all.map(final));
  $('#gStats').innerHTML=`<div class="grid4"><div class="stat s1"><b>${all.length}</b><small>Siswa terdata</small></div><div class="stat s2"><b>${done}</b><small>Menyelesaikan semua</small></div><div class="stat s3"><b>${pre}</b><small>Rata-rata Pre-test</small></div><div class="stat s4"><b>${fin}</b><small>Rata-rata LKPD (nilai guru / estimasi)</small></div></div>
  <div class="card"><h3>📊 Rata-rata per Kelas</h3><div class="bars" style="margin-top:10px">${KELAS.map(k=>{const g=all.filter(r=>r.kelas===k);const a=avg(g.map(r=>num(r.pre_total))),b=avg(g.map(final));return `<div class="bar-row"><span>${k}<br><small style="color:var(--mut)">${g.length} siswa</small></span><div class="bb"><div style="width:${Math.max(a,3)}%;background:#ff6bb5">Pre ${a}</div><div style="width:${Math.max(b,3)}%;background:#1fcfa8">LKPD ${b}</div></div></div>`}).join('')}</div></div>`;
  const t=$('#gTable');
  t.innerHTML=`<thead><tr><th>Nama</th><th>NIS</th><th>Kelas</th><th>Tahap</th><th>Pre</th><th>Sim A/B/C</th><th>LKPD auto</th><th>Nilai Guru</th><th>Selisih</th><th>Pelanggaran</th><th></th></tr></thead><tbody>${rows.length?rows.map((r,i)=>{const vi=jp(r.pelanggaran,{});const vs=(vi.paste||0)+(vi.copy||0)+(vi.tab||0)+(vi.jump||0);const f=final(r),p=num(r.pre_total);
   return `<tr><td><b>${esc(r.nama)}</b></td><td>${esc(r.nis)}</td><td>${esc(r.kelas)}</td><td><span class="chip-s">${esc(r.status==='Selesai'||r.status==='Dinilai'?'Selesai':r.tahap)}</span></td><td>${r.pre_total===''?'-':r.pre_total}</td><td>${r.sim_a===''?'-':r.sim_a} / ${r.sim_b===''?'-':r.sim_b} / ${r.sim_c===''?'-':r.sim_c}</td><td>${r.post_auto===''?'-':r.post_auto}</td><td>${r.nilai_guru===''?'<i style="color:var(--mut)">belum</i>':'<b>'+r.nilai_guru+'</b>'}</td><td>${f!==null&&p!==null?(f-p>=0?'▲ +':'▼ ')+Math.round((f-p)*10)/10:'-'}</td><td>${vs?`<span class="tag ora">⚠️ ${vs}</span>`:'—'}</td><td><button class="btn sm" data-id="${esc(r.id)}">Detail</button></td></tr>`}).join(''):'<tr><td colspan="11" style="text-align:center;color:var(--mut)">Belum ada data.</td></tr>'}</tbody>`;
  $$('#gTable button').forEach(b=>b.onclick=()=>detail(b.dataset.id));
}
function detail(id){
  const r=GURU.rows.find(x=>String(x.id)===String(id));if(!r)return;
  const vi=jp(r.pelanggaran,{}),rf=jp(r.refleksi,null),pj=jp(r.pre_jawaban,[]),det=jp(r.post_detail,[]);
  const m=$('#mDetailBody');
  m.innerHTML=`<div class="row" style="justify-content:space-between"><h3>👤 ${esc(r.nama)} · NIS ${esc(r.nis)} · ${esc(r.kelas)}</h3><button class="btn sm alt" id="dX">Tutup ✕</button></div>
  <p class="lead" style="margin:4px 0 12px">Tanggal: ${esc(r.tanggal)} · Update: ${esc(r.waktu_update)}</p>
  <div class="grid3"><div class="box b1x"><h4>Pre-test</h4>PG ${r.pre_pg||'-'} · PGK ${r.pre_pgk||'-'}<br><b>Total ${r.pre_total||'-'}</b></div><div class="box b2x"><h4>Simulasi</h4>A ${r.sim_a===''?'-':r.sim_a}/${SIM_A.length} · B ${r.sim_b===''?'-':r.sim_b}/${SIM_B.length} · C ${r.sim_c===''?'-':r.sim_c}</div><div class="box b3x"><h4>Integritas</h4>Paste ${vi.paste||0} · Copy ${vi.copy||0} · Pindah tab ${vi.tab||0} · Teks mendadak ${vi.jump||0}<br>Prediksi diri: ${r.prediksi===''?'-':r.prediksi}</div></div>
  <h4 style="margin:16px 0 8px">✍️ Jawaban LKPD</h4>
  ${LKPD.map((q,i)=>`<div class="q"><div class="qn"><b>${i+1}</b><div><span class="tag" style="margin-bottom:4px">${q.tp}</span><div style="font-weight:600">${q.q}</div></div></div><div class="box b1x" style="white-space:pre-wrap">${esc(r['post_'+(i+1)])||'<i>belum dijawab</i>'}</div><p style="font-size:12px;color:var(--mut);margin-top:6px">Rubrik: ${q.rub}<br>Kecocokan kata kunci otomatis: <b>${det[i]!==undefined?det[i]:'-'}%</b></p></div>`).join('')}
  ${rf?`<h4 style="margin:16px 0 8px">💭 Refleksi</h4><div class="box b4x"><b>Skor regulasi diri:</b> ${REFL_LIK.map((g,i)=>g.g+' '+(rf.domain?rf.domain[i]:'-')+'/5').join(' · ')}<br><b>Reaksi spontan:</b> ${Object.values(rf.impl||{}).map(esc).join(' | ')}<br><b>Strategi:</b> ${esc((rf.strat||[]).join(', ')||'-')}<hr style="border:0;border-top:1px dashed #e6c86e;margin:8px 0">${REFL_OPEN.map(q=>`<b>${q.q}</b><br>${esc((rf.open||{})[q.id]||'-')}<br>`).join('<br>')}</div>`:''}
  <h4 style="margin:16px 0 8px">🎓 Penilaian Guru</h4><div class="grid2"><div class="field"><label class="l">Nilai LKPD (0–100)</label><input type="text" id="dNilai" inputmode="decimal" value="${esc(r.nilai_guru)}" placeholder="${esc(r.post_auto)}"></div><div class="field"><label class="l">Catatan / umpan balik</label><input type="text" id="dCat" value="${esc(r.catatan_guru)}"></div></div>
  <button class="btn" id="dSave">Simpan Nilai</button>`;
  $('#mDetail').classList.add('on');
  $('#dX').onclick=()=>$('#mDetail').classList.remove('on');
  $('#dSave').onclick=async()=>{
    const n=parseFloat(String($('#dNilai').value).replace(',','.'));if(isNaN(n)||n<0||n>100)return toast('Nilai harus 0–100');
    const c=$('#dCat').value.trim();
    if(GURU.local){r.nilai_guru=n;r.catatan_guru=c;drawGuru();$('#mDetail').classList.remove('on');return toast('Tersimpan (lokal)')}
    try{const j=await api('grade',{password:GURU.pw,id:r.id,nilai_guru:n,catatan_guru:c});if(j.ok){r.nilai_guru=n;r.catatan_guru=c;r.status='Dinilai';drawGuru();$('#mDetail').classList.remove('on');toast('Nilai tersimpan ke Google Sheet ✅')}else toast(j.error||'Gagal')}catch(e){toast('Gagal terhubung')}
  };
}
$('#mDetail').addEventListener('click',e=>{if(e.target.id==='mDetail')e.target.classList.remove('on')});
function csv(){
  const cols=['nama','nis','kelas','tanggal','status','pre_pg','pre_pgk','pre_total','sim_a','sim_b','sim_c','prediksi','post_auto','nilai_guru','catatan_guru','pelanggaran'];
  const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
  const t=[cols.join(',')].concat(filtered().map(r=>cols.map(c=>q(r[c])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='hasil-ppsk-xii.csv';a.click();
}


/* ============================================================
   MULAI
   ============================================================ */
$('#appName').textContent=CFG.JUDUL||'Perencanaan dan Pengembangan Sistem Komputer';$('#appSub').textContent=CFG.MAPEL||'MPI Informatika XII';
(function init(){
  if(S.profile&&S.stage&&S.stage!=='login'&&unlocked(S.stage)){go(S.stage)}else go('login');
})();
</script>
</body>
